{% extends "base.html" %}

{% block page_title %}Bảng điều khiển công ty{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h6 class="text-uppercase text-muted">Số dư tài khoản</h6>
                <h3 class="mt-2 text-primary">150.000.000 VNĐ</h3>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h6 class="text-uppercase text-muted">Công ty</h6>
                <h5 class="mt-2">{{ request.user.profile.company.name }}</h5>
                <small class="text-muted">MST: {{ request.user.profile.company.tax_code }}</small>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card shadow-sm">
            <div class="card-header bg-white">Gần đây</div>
            <div class="card-body">
                <p>Chưa có chứng từ nào được ghi nhận.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
