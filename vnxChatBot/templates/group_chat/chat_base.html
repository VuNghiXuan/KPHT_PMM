<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>VnxChatBot - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sidebar-w: 260px;
            --kb-w: 320px;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #f8f9fa;
        }

        .chat-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-w);
            background: #ffffff;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .kb-sidebar {
            width: var(--kb-w);
            background: #fdfdfd;
            border-left: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
        }

        /* Avatar & User Style */
        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0d6efd;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <!-- Sidebar Trái: Danh sách nhóm -->
        <div class="sidebar">
            <div class="p-3 border-bottom d-flex align-items-center">
                <h6 class="mb-0 fw-bold text-primary">VnxChatBot</h6>
            </div>
            <nav class="nav nav-pills flex-column px-2 mt-2">
                {% for grp in user_groups %}
                <a class="nav-link {% if grp.id == group.id %}active{% endif %}"
                    href="{% url 'group_chat:detail' grp.id %}">
                    <i class="fas fa-hashtag me-2"></i> {{ grp.name }}
                </a>
                {% endfor %}
            </nav>
            <!-- Phần hiển thị User dưới cùng Sidebar -->
            <div class="mt-auto p-3 border-top d-flex align-items-center bg-light">
                <img src="{{ user.profile.avatar.url|default:'/static/default-avatar.png' }}" class="user-avatar me-2"
                    alt="Avatar">
                <div class="small">
                    <div class="fw-bold">{{ user.username }}</div>
                    <div class="text-muted" style="font-size: 0.75rem;">Premium Member</div>
                </div>
            </div>
        </div>

        <!-- Nội dung chính -->
        <div class="main-content">
            <div class="p-3 border-bottom bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">{{ group.name }}</h5>
                <button class="btn btn-sm btn-outline-primary"><i class="fas fa-cog"></i></button>
            </div>
            <div class="chat-messages">
                {% block chat_content %}{% endblock %}
            </div>
        </div>

        <!-- Sidebar Phải (Knowledge Hub) -->
        <div class="kb-sidebar">
            <div class="p-3 border-bottom bg-white">
                <h6><i class="fas fa-magic me-2"></i> Trợ lý thông minh</h6>
            </div>
            {% block knowledge_management %}{% endblock %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
