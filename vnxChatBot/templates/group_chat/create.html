{% extends "base.html" %}

{% block title %}Tạo nhóm mới{% endblock %}

{% block page_title %}Khởi tạo Nhóm Làm Việc{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h4 class="fw-bold mb-4 text-center text-dark">
                        <i class="fas fa-users text-primary me-2"></i>Tạo Nhóm Mới 👥
                    </h4>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên nhóm làm việc 🏷️</label>
                            <input type="text" name="name" class="form-control rounded-3"
                                placeholder="Ví dụ: Đội ngũ KPHT" required>
                            <div class="form-text small text-muted mt-1">Mỗi nhóm là một không gian độc lập tích hợp trợ
                                lý AI riêng 🧠.</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-semibold shadow-sm">
                            <i class="fas fa-plus-circle me-1"></i> Khởi tạo nhóm ngay 🚀
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
