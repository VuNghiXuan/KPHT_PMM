<!-- 
  File: templates/group_chat/partials/_settings_offcanvas.html
  Mục đích: Chuyển đổi từ Offcanvas drawer sang Panel cố định 4 cột bên phải, giữ nguyên hệ thống Tab con.
-->
<div class="h-100 d-flex flex-column bg-white w-100">
    <!-- Header của Cột Phải -->
    <div class="p-3 bg-light border-bottom">
        <h6 class="mb-0 fw-bold text-primary">
            <i class="fas fa-info-circle me-2"></i> Thông tin & Quản trị nhóm
        </h6>
    </div>

    <!-- Navigation Tabs cho Panel -->
    <ul class="nav nav-tabs nav-fill bg-white border-bottom flex-shrink-0" id="offcanvasTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active py-2 fw-semibold small px-1" id="members-tab" data-bs-toggle="tab"
                data-bs-target="#members-pane" type="button" role="tab">
                <i class="fas fa-users me-1"></i> Thành viên (<span id="member-count">{{ group.members.count }}</span>)
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link py-2 fw-semibold small px-1" id="ai-config-tab" data-bs-toggle="tab"
                data-bs-target="#ai-config-pane" type="button" role="tab">
                <i class="fas fa-robot me-1"></i> Model AI
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link py-2 fw-semibold small px-1" id="knowledge-tab" data-bs-toggle="tab"
                data-bs-target="#knowledge-pane" type="button" role="tab">
                <i class="fas fa-brain me-1"></i> Tri thức
            </button>
        </li>
    </ul>

    <!-- Tab Contents (Giữ nguyên các file include con của bạn) -->
    <div class="tab-content flex-grow-1 overflow-auto bg-light p-3" id="offcanvasTabContent">
        {% include "group_chat/partials/tabs/_members_tab.html" %}
        {% include "group_chat/partials/tabs/_ai_config_tab.html" %}
        {% include "group_chat/partials/tabs/_knowledge_tab.html" %}
    </div>
</div>
