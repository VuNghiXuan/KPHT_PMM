<!-- apps/group_chat/templates/group_chat/partials/members_tab.html -->
{% load static %}
<div class="p-3">
    <h6 class="fw-bold mb-3"><i class="fas fa-users text-primary"></i> Thành viên trong nhóm</h6>

    <!-- Form Thêm thành viên -->
    <form id="add-member-form" class="mb-3 p-2 bg-light rounded border">
        <div class="mb-2">
            <input type="text" id="new-member-username" class="form-control form-control-sm"
                placeholder="Nhập username..." required>
        </div>
        <div class="mb-2">
            <select id="new-member-role" class="form-select form-select-sm">
                <option value="member">Thành viên (Member)</option>
                <option value="admin">Quản trị viên (Admin)</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary btn-sm w-100 py-1" style="font-size: 0.8rem;">
            <i class="fas fa-user-plus"></i> Thêm thành viên ➕
        </button>
    </form>

    <!-- Danh sách thành viên hiện tại -->
    <div class="list-group list-group-flush" style="max-height: 250px; overflow-y: auto;">
        {% for membership in memberships %}
        <div class="list-group-item px-0 py-2 d-flex justify-content-between align-items-center">
            <div>
                <span class="small fw-bold">
                    {% if membership.user.profile.is_ai %}
                    🤖 AI Assistant
                    {% else %}
                    {{ membership.user.username }}
                    {% endif %}
                </span>
                <small class="d-block text-muted" style="font-size: 0.65rem;">Vai trò: {{ membership.get_role_display
                    }}</small>
            </div>
            <span
                class="badge {% if membership.role == 'owner' %}bg-danger{% elif membership.role == 'admin' %}bg-primary{% else %}bg-secondary{% endif %}"
                style="font-size: 0.6rem;">
                {{ membership.role }}
            </span>
        </div>
        {% endfor %}
    </div>

    <script>
        /**
         * Xử lý sự kiện submit form thêm thành viên qua chuẩn JSON API,
         * đảm bảo gửi đúng định dạng và xử lý phản hồi an toàn từ backend Django.
         */
        document.getElementById('add-member-form').onsubmit = function (e) {
            e.preventDefault();
            const username = document.getElementById('new-member-username').value.trim();
            const role = document.getElementById('new-member-role').value;

            // Gọi hàm thực thi gửi request chuẩn JSON
            addMemberToGroup("{{ group.id }}", username, role);
        };

        /**
         * Function: addMemberToGroup
         * Description: Gửi yêu cầu thêm thành viên mới vào nhóm qua chuẩn JSON API,
         * xử lý phản hồi trả về từ backend Django tránh lỗi trả về trang HTML.
         */
        function addMemberToGroup(groupId, identifier, role = 'member') {
            // Đảm bảo URL khớp với cấu trúc định tuyến của Django
            const url = `/chat/${groupId}/add-member/`; // Hoặc tuỳ thuộc vào tiền tố URL gốc của bạn (ví dụ: /groups/... hoặc /chat/...)

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    username: identifier,
                    role: role
                })
            })
                .then(async response => {
                    const contentType = response.headers.get("content-type");
                    if (!contentType || !contentType.includes("application/json")) {
                        // Nếu server trả về HTML thay vì JSON, ném lỗi kèm nội dung để debug
                        const text = await response.text();
                        throw new Error("Server trả về mã lỗi HTML thay vì JSON. Vui lòng kiểm tra lại URL hoặc quyền truy cập.");
                    }

                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.message || 'Lỗi hệ thống không xác định.');
                    }
                    return data;
                })
                .then(data => {
                    if (data.status === 'success') {
                        alert("✅ " + data.message);
                        location.reload();
                    } else {
                        alert("⚠️ " + data.message);
                    }
                })
                .catch(error => {
                    console.error('Add Member Error:', error);
                    alert('❌ Thêm thành viên thất bại: ' + error.message);
                });
        }

        /**
         * Hàm hỗ trợ lấy CSRF Token từ cookie của Django
         */
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
