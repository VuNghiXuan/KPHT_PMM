<!-- 
Mục đích: Giao diện cấu hình AI Provider (OpenAI/Gemini) và API Key riêng cho nhóm chat.
Tác giả: Kiến trúc sư VnxChatBot
-->
<div class="p-3">
    <h6 class="fw-bold mb-3"><i class="fas fa-brain text-primary"></i> Cấu hình Trợ lý AI cho Nhóm</h6>
    <form id="ai-config-form">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Chọn nhà cung cấp LLM (AI Provider)</label>
            <select name="provider_type" class="form-select" id="provider-select">
                <option value="gemini" {% if ai_config.is_gemini %}selected{% endif %}>
                    Google Gemini (Default)
                </option>
                <option value="openai" {% if ai_config.is_openai %}selected{% endif %}>
                    OpenAI GPT
                </option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">API Key riêng cho nhóm (Tùy chọn)</label>
            <input type="password" name="api_key" class="form-control"
                value="{% if ai_config %}{{ ai_config.api_key }}{% endif %}"
                placeholder="Bỏ trống nếu dùng cấu hình chung hệ thống">
            <div class="form-text">Bảo mật tuyệt đối qua biến môi trường của tenant nhóm.</div>
        </div>
        <button type="submit" class="btn btn-success btn-sm">Lưu cấu hình AI</button>
    </form>
</div>
<script>
    function saveAIConfig(e) {
        e.preventDefault();
        const provider = document.getElementById('ai-provider').value;
        const temperature = document.getElementById('ai-temperature').value;
        const system_prompt = document.getElementById('ai-prompt').value;

        fetch("{% url 'group_chat:update_ai_config' group.id %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ provider, temperature, system_prompt })
        })
            .then(res => res.json())
            .then(data => alert(data.message))
            .catch(err => console.error('AI Config Error:', err));
    }
</script>
