<!-- [MODAL UPLOAD TÀI LIỆU CÔ LẬP THEO GROUP-ID] -->
<div class="modal fade" id="uploadDocumentModal" tabindex="-1" aria-labelledby="uploadDocumentModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow border-0">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold text-dark" id="uploadDocumentModalLabel">
                    <i class="fas fa-file-upload text-primary me-2"></i> Tải lên tài liệu mới
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="global-upload-form" method="POST" enctype="multipart/form-data"
                action="{% url 'group_chat:upload' group.id %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="modal-file-input" class="form-label fw-semibold">Chọn tệp tài liệu (PDF, DOCX,
                            TXT)</label>
                        <input type="file" name="file" id="modal-file-input" class="form-control" required>
                        <div class="form-text small text-muted mt-1">
                            Hệ thống sẽ tự động kích hoạt pipeline xử lý và kiểm toán dữ liệu ngầm qua Celery.
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Hủy bỏ</button>
                    <button type="submit" class="btn btn-primary btn-sm px-4">
                        <i class="fas fa-cloud-upload-alt me-1"></i> Bắt đầu tải lên
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
