<!-- 
  File: templates/group_chat/partials/_sidebar_groups.html
  Mục đích: Cột 2 - Quản lý danh sách nhóm (Tenant-based isolation).
-->
<div class="d-flex flex-column border-end bg-light" style="width: 300px; min-width: 300px;">
    <div class="p-3 border-bottom bg-white">
        <div class="input-group input-group-sm">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-search"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" placeholder="Tìm kiếm nhóm, tin nhắn...">
        </div>
    </div>

    <div class="flex-grow-1 overflow-auto p-2">
        <div class="small fw-bold text-muted px-2 mb-2">NHÓM LÀM VIỆC (TENANT)</div>

        {% for grp in user_groups %}
        <a href="{% url 'group_chat:chat_detail' grp.id %}"
            class="d-flex align-items-center gap-3 p-2 rounded text-decoration-none mb-1 {% if grp.id == group.id %}bg-primary bg-opacity-10 border border-primary border-opacity-25{% else %}hover-bg-light{% endif %}">
            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold"
                style="width: 40px; height: 40px; min-width: 40px;">
                {{ grp.name|slice:":2"|upper }}
            </div>
            <div class="flex-grow-1 overflow-hidden">
                <div class="fw-bold text-dark text-truncate">{{ grp.name }}</div>
                <small class="text-muted text-truncate d-block">Thảo luận nhóm & AI 🤖</small>
            </div>
        </a>
        {% endfor %}
    </div>
</div>
