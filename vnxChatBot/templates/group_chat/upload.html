{% extends "group_chat/chat_base.html" %}

{% block title %}Upload Tài Liệu | {{ group.name }}{% endblock %}

{% block chat_content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h4 class="fw-bold mb-3">Tải tài liệu lên nhóm</h4>
                    <p class="text-muted small">Tài liệu sẽ được AI trích xuất và lưu trữ vào kho tri thức của nhóm
                        <strong>{{ group.name }}</strong>.
                    </p>

                    <form id="upload-form" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="file" class="form-label">Chọn tệp (PDF, DOCX, TXT)</label>
                            <input type="file" name="file" id="file" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-cloud-upload-alt me-2"></i> Bắt đầu xử lý
                        </button>
                    </form>

                    <div id="status-message" class="mt-3 text-center small"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('upload-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const formData = new FormData(this);

        // Sử dụng URL được render trực tiếp từ Django
        const uploadUrl = "{% url 'group_chat:upload' group.id %}";

        fetch(uploadUrl, {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': '{{ csrf_token }}'
            }
        })
            .then(response => response.json())
            .then(data => {
                if (data.doc_id) {
                    alert('Thành công! AI đang trích xuất dữ liệu.');
                } else {
                    alert('Lỗi: ' + (data.error || 'Có lỗi xảy ra'));
                }
            })
            .catch(err => console.error('Upload Error:', err));
    });
</script>
{% endblock %}
