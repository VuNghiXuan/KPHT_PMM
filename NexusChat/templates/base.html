{% load static %}
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>NexusChat | {% block title %}Dashboard{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/fontawesome/css/all.min.css' %}">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> -->
    <link rel="stylesheet" href="{% static 'css/ledger_theme.css' %}">
</head>

<body class="d-flex">
    <div class="sidebar d-flex flex-column" id="sidebar">
        <h4 class="p-3 text-white border-bottom border-secondary text-center">NexusChat</h4>
        <nav class="nav flex-column mt-2">
            <a href="{% url 'dashboard' %}" class="nav-link text-white"><i class="fas fa-tachometer-alt me-2"></i>
                Dashboard</a>
            <a href="/accounting/" class="nav-link text-white"><i class="fas fa-file-invoice me-2"></i> Kế toán lõi</a>
            <a href="/admin/" target="_blank" class="nav-link text-white"><i class="fas fa-cog me-2"></i> Admin
                Django</a>
        </nav>
    </div>

    <div class="main-content flex-grow-1">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4">
            <button class="btn btn-outline-dark btn-sm me-3" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            <span class="navbar-brand mb-0 h1">{% block page_title %}Tổng quan{% endblock %}</span>
            <div class="ms-auto">
                <form action="{% url 'core:logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-sm">Đăng xuất</button>
                </form>
            </div>
        </nav>
        <div class="container-fluid p-4">{% block content %}{% endblock %}</div>
    </div>

    <script>
        document.getElementById('sidebarToggle').addEventListener('click', function () {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });
    </script>
</body>

</html>
