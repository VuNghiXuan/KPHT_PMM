{% extends "admin/base_site.html" %}

{% block content %}
<style>
    .tab-nav {
        margin-bottom: 15px;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
        display: flex;
        gap: 10px;
    }

    .admin-tab-btn {
        background: #79aec8;
        color: #fff;
        border: none;
        padding: 8px 15px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
    }

    .btn-download {
        background: #417690;
        color: #fff;
        padding: 8px 15px;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
        font-size: 13px;
    }

    #erd-wrapper {
        width: 100%;
        height: 70vh;
        background: #fff;
        border: 1px solid #ddd;
        overflow: hidden;
        position: relative;
        cursor: grab;
    }

    #mermaid-container {
        transform-origin: 0 0;
        display: inline-block;
        transition: transform 0.1s ease-out;
    }

    /* Ép tất cả các phần tử của Mermaid không bị cắt xén */
    .mermaid svg {
        max-width: none !important;
        height: auto !important;
        overflow: visible !important;
    }

    .mermaid .nodeLabel,
    .mermaid .node>div {
        overflow: visible !important;
        white-space: nowrap !important;
    }
</style>

<div class="tab-nav">
    <button class="admin-tab-btn" onclick="showTab('erd')">ERD Diagram</button>
    <button class="admin-tab-btn" onclick="showTab('manifest')">Project Manifest</button>
    <a href="{% url 'download_manifest' %}" class="btn-download">Tải PROJECT_MANIFEST.md</a>
</div>

<div id="erd" class="tab-content" style="display: block;">
    <div id="erd-wrapper">
        <div id="mermaid-container" class="mermaid">{{ mermaid_code|safe }}</div>
    </div>
    <div style="margin-top: 10px; color: #666; font-size: 12px;">* Lăn chuột zoom, kéo để di chuyển.</div>
</div>

<div id="manifest" class="tab-content" style="display:none;">
    <pre style="white-space: pre-wrap; background: #eee; padding: 15px;">{{ manifest_content }}</pre>
</div>

<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        flowchart: {
            htmlLabels: true,
            useMaxWidth: false,
            curve: 'basis'
        }
    });

    const container = document.getElementById('mermaid-container');
    const wrapper = document.getElementById('erd-wrapper');

    let scale = 0.8;
    let posX = 20;
    let posY = 20;

    async function renderMermaid() {
        // Cực kỳ quan trọng: Xóa trắng container trước khi render để đảm bảo sạch DOM
        container.innerHTML = '<div class="mermaid">{{ mermaid_code|safe }}</div>';

        const { svg } = await mermaid.render('mermaid-svg', '{{ mermaid_code|safe }}'.trim());
        container.innerHTML = svg;

        // Ép style trực tiếp vào DOM vừa được render
        const labels = container.querySelectorAll('.nodeLabel');
        labels.forEach(el => {
            el.style.setProperty('white-space', 'nowrap', 'important');
            el.style.setProperty('overflow', 'visible', 'important');
        });

        updateTransform();
    }

    function updateTransform() {
        container.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }

    wrapper.addEventListener('wheel', (e) => {
        e.preventDefault();
        scale *= (e.deltaY > 0 ? 0.9 : 1.1);
        scale = Math.min(Math.max(scale, 0.1), 3);
        updateTransform();
    }, { passive: false });

    let isDragging = false;
    wrapper.addEventListener('mousedown', () => isDragging = true);
    wrapper.addEventListener('mouseup', () => isDragging = false);
    wrapper.addEventListener('mousemove', (e) => {
        if (isDragging) { posX += e.movementX; posY += e.movementY; updateTransform(); }
    });

    window.showTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        if (id === 'erd') renderMermaid();
    }

    renderMermaid();
</script>
{% endblock %}
